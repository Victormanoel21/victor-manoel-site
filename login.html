
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090511">
    <title>Entrar | Victor Manoel</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <canvas id="matrix"></canvas>

    <main class="login-container">
        <div class="login-card">

            <div class="logo-area">
                <img src="logo.png" alt="Logo Victor Manoel">
            </div>

            <div class="heading">
                <span class="system-label">SISTEMA DE ACESSO</span>
                <h1>Bem-vindo de volta</h1>
                <p>Entre na sua conta para continuar.</p>
            </div>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="seuemail@exemplo.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <div class="password-box">
                        <input
                            type="password"
                            id="password"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" id="togglePassword">Mostrar</button>
                    </div>
                </div>

                <div class="form-options">
                    <button type="button" id="forgotPassword">
                        Esqueceu sua senha?
                    </button>
                </div>

                <p id="message" class="message"></p>

                <button type="submit" class="login-button">
                    Entrar na conta
                </button>

            </form>

            <div class="register-link">
                Ainda não tem uma conta?
                <a href="cadastro.html">Criar minha conta</a>
            </div>

            <div class="footer">
                <span>VICTOR MANOEL</span>
                <p>ACESSO DIGITAL • 2026</p>
            </div>

        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="login.js"></script>

</body>
</html>
